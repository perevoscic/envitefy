appId: com.android.vending
name: Google tester password submission
---
- extendedWaitUntil:
    visible: "Enter your password"
    timeout: 30000
- assertVisible: '.*${MAESTRO_EMAIL_PATTERN}.*'
- tapOn: "Enter your password"
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn: "Next"
# This screenshot may show verification/MFA. It is not proof of successful login.
- takeScreenshot: google-password-submission-result
