appId: com.google.android.gms
name: Authorized Google device account password
---
- assertVisible: "Welcome"
- assertVisible: '.*${MAESTRO_EMAIL_PATTERN}.*'
- extendedWaitUntil:
    visible: "Enter your password"
    timeout: 30000
- tapOn: "Enter your password"
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn: "(?i)next"
- takeScreenshot: google-device-password-result
