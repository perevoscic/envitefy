appId: com.android.chrome
name: Google OAuth tester password submission
---
- assertVisible: 'accounts\.google\.com'
- extendedWaitUntil:
    visible: "Enter your password|Введите пароль"
    timeout: 30000
- assertVisible: '.*${MAESTRO_EMAIL_PATTERN}.*'
- tapOn: "Enter your password|Введите пароль"
- pressKey: Backspace
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn: "Next|Далее"
- takeScreenshot: google-oauth-password-result
