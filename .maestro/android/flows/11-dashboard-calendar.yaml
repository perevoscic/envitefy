# Android accessibility selectors: device calibration is pending.
appId: ${MAESTRO_ANDROID_APP_ID}
name: QA11 dashboard filters and calendar
tags: [dashboard, calendar]
---
- runFlow: ../shared/login.yaml
- openLink:
    link: ${MAESTRO_BASE_URL}/
- scrollUntilVisible:
    element:
      text: "My events.*"
    direction: DOWN
    timeout: 30000
- tapOn: "My events.*"
- assertVisible: ${MAESTRO_EVENT_TITLE}
- tapOn: "Invited events.*"
- assertNotVisible: ${MAESTRO_EVENT_TITLE}
- tapOn: "My events.*"
- openLink:
    link: ${MAESTRO_BASE_URL}/card/${MAESTRO_EVENT_ID}
- extendedWaitUntil:
    visible: "(?i)to calendar"
    timeout: 60000
- tapOn: "(?i)to calendar"
- takeScreenshot: calendar-choices
