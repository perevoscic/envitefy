# Android accessibility selectors: device calibration is pending.
appId: ${MAESTRO_ANDROID_APP_ID}
name: QA04 Event Page sections
tags: [event-page, composition]
---
- runFlow: ../shared/login.yaml
- openLink:
    link: ${MAESTRO_BASE_URL}/event/general/customize?templateId=coffee-conversation
- extendedWaitUntil:
    visible: "Page sections"
    timeout: 60000
- tapOn: "Page sections"
- tapOn: "Add section"
- tapOn: "Custom section.*"
- extendedWaitUntil:
    visible: "Section heading"
    timeout: 15000
- tapOn: "Section heading"
- eraseText: 50
- inputText: "QA04 arrival information"
- hideKeyboard
- tapOn: "Section content"
- inputText: "Use the north entrance."
- hideKeyboard
- assertVisible: "QA04 arrival information"
- assertVisible: "Use the north entrance."
- takeScreenshot: custom-event-section
