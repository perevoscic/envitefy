appId: com.android.chrome
name: Resolve Google's account limit in the dedicated test emulator
---
- swipe:
    direction: DOWN
- assertVisible: 'accounts\.google\.com'
- assertVisible: "Вы вошли в максимальное число аккаунтов.*|.*maximum number of accounts.*"
- takeScreenshot: google-account-limit
- tapOn: "^(Выйти|Sign out)$"
- extendedWaitUntil:
    visible: "Email or phone|Телефон или электронный адрес|Choose an account|Выберите аккаунт"
    timeout: 60000
- takeScreenshot: google-after-web-signout
