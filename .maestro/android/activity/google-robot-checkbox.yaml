appId: com.android.chrome
name: Click the owner-requested Google verification checkbox
---
- assertVisible: "accounts.google.com"
- assertVisible: '${MAESTRO_EMAIL_PATTERN}'
- assertVisible: "I'm not a robot"
- tapOn:
    id: "recaptcha-anchor"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: google-robot-checkbox-result
