# Disabled by user instruction: do not run QA11.
url: ${MAESTRO_BASE_URL}
name: QA11 dashboard filters and calendar
tags: [dashboard, calendar]
---
- runFlow: ../shared/login.yaml
- openLink: ${MAESTRO_BASE_URL}/
- scrollUntilVisible:
    element:
      text: "My events.*"
    direction: DOWN
    timeout: 30000
- tapOn: "My events.*"
- assertVisible: ${MAESTRO_EVENT_TITLE}
- tapOn: "Invited events.*"
- assertNotVisible: ${MAESTRO_EVENT_TITLE}
- tapOn: "My events.*"
- openLink: ${MAESTRO_BASE_URL}/card/${MAESTRO_EVENT_ID}
- extendedWaitUntil:
    visible:
      id: "To Calendar"
    timeout: 60000
- tapOn:
    id: "To Calendar"
- takeScreenshot: calendar-choices
