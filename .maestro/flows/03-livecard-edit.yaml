url: ${MAESTRO_BASE_URL}
name: QA03 edit a published Live Card
tags: [livecard, persistence]
---
- runFlow: ../shared/login.yaml
- openLink: ${MAESTRO_BASE_URL}/live-cards?edit=${MAESTRO_EVENT_ID}
- extendedWaitUntil:
    visible: "Save changes"
    timeout: 60000
- tapOn: "Message to guests.*"
- tapOn:
    id: livecard-overview
- eraseText: 50
- inputText: "QA03 changed guest message"
- tapOn: "Save changes"
- extendedWaitUntil:
    visible: "Changes saved.*"
    timeout: 60000
- openLink: ${MAESTRO_BASE_URL}/live-cards?edit=${MAESTRO_EVENT_ID}
- tapOn: "Message to guests.*"
- assertVisible: "QA03 changed guest message"
- assertNotVisible: "Publish invitation"
- takeScreenshot: published-changes-retained
