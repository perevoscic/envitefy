name: Create event fact integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preserve-event-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check push completeness safeguards
        run: npm run test:git-hooks
      - name: Check application TypeScript before running regressions
        id: typecheck
        run: npm run typecheck
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-headless-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for isolated campaign checks
        id: chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install and verify FFmpeg for artwork checks
        id: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Check Create facts, prompts, output contracts and guest actions offline
        run: npm run test:create-remediation
      - name: Check rendered previews and RSVP recovery with external requests blocked
        # Keep browser evidence when the offline suite fails; its failure still fails the job.
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' && steps.chromium.outcome == 'success' && steps.ffmpeg.outcome == 'success' }}
        run: npm run test:create-browser
      - name: Keep editor screenshots on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: event-editor-failure
          path: .qa/event-editor-browser/*.png
          if-no-files-found: ignore
          retention-days: 7
