name: Create event fact integrity

# Local pre-push runs test:git-hooks and typecheck. This workflow is the run of
# test:create-remediation and test:create-browser, on pull requests and on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preserve-event-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install Bun for browser fixture builds
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Verify Bun runtime
        id: bun
        run: bun --version
      - run: npm ci
      - name: Check push validation safeguards
        run: npm run test:git-hooks
      - name: Check application TypeScript before running regressions
        id: typecheck
        run: npm run typecheck
      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-headless-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for isolated campaign checks
        id: chromium
        run: |
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if npx playwright install --with-deps --only-shell chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Chromium install failed on attempt ${attempt}; retrying after the Ubuntu archive lookup."
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
      - name: Install and verify FFmpeg for artwork checks
        id: ffmpeg
        run: |
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
              sudo apt-get update
              sudo apt-get install --yes --no-install-recommends ffmpeg
            fi
            if ffmpeg -version && ffprobe -version; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "FFmpeg install failed on attempt ${attempt}; retrying after the Ubuntu archive lookup."
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
      - name: Check Create facts, prompts, output contracts and guest actions offline
        run: npm run test:create-remediation
      - name: Check rendered previews and RSVP recovery with external requests blocked
        # Keep browser evidence when the offline suite fails; its failure still fails the job.
        if: ${{ !cancelled() && steps.bun.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.chromium.outcome == 'success' && steps.ffmpeg.outcome == 'success' }}
        run: npm run test:create-browser
      - name: Keep editor screenshots on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: event-editor-failure
          path: |
            .qa/event-editor-browser/*.png
            .qa/product-urls/*.png
            output/owner-card-preview/*.png
          if-no-files-found: ignore
          retention-days: 7
