name: Create event fact integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preserve-event-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:create-facts
      - name: Check chat viewport and keyboard behavior
        run: node --test src/hooks/useVisualViewportInsets.test.mjs
